<div class="action-btn-conteiner">
  <button class="action-btn" (click)="editWidget(1)">
    <lucide-icon [img]="buttons.edit" [strokeWidth]="2" [size]="15" />
  </button>
  <button class="action-btn drag-handle">
    <lucide-icon [img]="buttons.move" [strokeWidth]="2" [size]="15" />
  </button>
  <button class="action-btn delete" (click)="deleteWidget(1)">
    <lucide-icon [img]="buttons.delete" [strokeWidth]="2" [size]="15" />
  </button>
</div>
