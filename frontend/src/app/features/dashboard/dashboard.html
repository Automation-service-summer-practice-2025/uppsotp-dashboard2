<gridster [options]="options" class="gridster">
  <gridster-item [item]="widget" *ngFor="let widget of dashboardWidgets">
    <widget-toolbar
      class="widget-toolbar-visibility"
      [newWidgetId]="widget.id"
    ></widget-toolbar>
    <widget-render></widget-render>
  </gridster-item>
</gridster>
