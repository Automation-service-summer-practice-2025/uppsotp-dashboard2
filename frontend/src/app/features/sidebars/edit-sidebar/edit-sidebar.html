<div class="edit-sidebar-container">
  <header class="header">
    <p>Редактор виджета</p>
    <button class="close-edit-sidebar-btn" (click)="onClose()">
      <lucide-icon [img]="btn_close" [strokeWidth]="1" [size]="25" />
    </button>
  </header>

  <template #editorContainer></template>

  <div class="sidebar-footer-delete">
    <div class="divider"></div>
    <button class="btn delete full-width" (click)="onDelete()">Удалить</button>
  </div>
</div>
