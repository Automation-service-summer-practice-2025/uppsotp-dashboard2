<div class="chart-container">
  @if (widget.chartData.labels?.length || widget.chartData.datasets.length) {
  <canvas
    baseChart
    [data]="widget.chartData"
    [options]="widget.chartOptions"
    [type]="widget.chartType"
  >
  </canvas>
  } @else {
  <lucide-icon [img]="chartIcon" [size]="90" />
  }
</div>
