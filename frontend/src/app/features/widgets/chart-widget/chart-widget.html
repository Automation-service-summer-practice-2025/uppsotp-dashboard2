<div class="chart-container">
  @if (widget.csvRawData) {
  <canvas
    baseChart
    [data]="widget.chartData"
    [options]="widget.chartOptions"
    [type]="widget.chartType"
  >
  </canvas>
  } @else {
  <div class="widget-placeholder">
    <lucide-icon [img]="chartIcon" [size]="50"></lucide-icon>
    <p class="widget-placeholder-caption">Нажмите для изменения</p>
  </div>
  }
</div>
