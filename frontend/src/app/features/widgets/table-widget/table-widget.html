@if (widget.columnsTable.length > 1 || this.dashboardCurrentWidget?.id ===
this.widget.id) {
<ag-grid-angular
  [theme]="widget.currentTheme"
  [rowData]="widget.rowsTable"
  [columnDefs]="widget.columnsTable"
  [components]="frameworkComponents"
  (gridReady)="onGridReady($event)"
  [gridOptions]="gridOptions"
></ag-grid-angular>
} @else {
<div class="widget-placeholder">
  <lucide-icon [img]="iconTable" [size]="50"></lucide-icon>
  <p class="widget-placeholder-caption">Нажмите для изменения</p>
</div>
}
