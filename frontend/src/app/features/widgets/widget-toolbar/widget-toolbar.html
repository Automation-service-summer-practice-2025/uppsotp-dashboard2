<div class="widget-toolbar-container">
  <button class="widget-toolbar-btn drag-handle">
    <lucide-icon [img]="buttons.move" [strokeWidth]="2" [size]="15" />
  </button>
  <button class="widget-toolbar-btn" (click)="editWidget(newWidget)">
    <lucide-icon [img]="buttons.edit" [strokeWidth]="2" [size]="15" />
  </button>
  <button class="widget-toolbar-btn delete" (click)="delWidget(newWidget)">
    <lucide-icon [img]="buttons.delete" [strokeWidth]="2" [size]="15" />
  </button>
</div>
