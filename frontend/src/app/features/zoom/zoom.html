<div class="zoom-controls-container">
  <button class="button" (click)="zoomOut()" title="Уменьшить">
    <lucide-icon [name]="zoomDecreaseIcon"></lucide-icon>
  </button>
  <span class="zoom-label">{{ zoomLevel }}%</span>
  <button class="button" (click)="zoomIn()" title="Увеличить">
    <lucide-icon [name]="zoomIncreaseIcon"></lucide-icon>
  </button>
</div>
