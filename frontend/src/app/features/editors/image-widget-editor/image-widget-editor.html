<div class="image-widget-editor">
  <div class="image-upload-section">
    <label for="imageUpload">Загрузить изображение</label>
    <input
      id="imageUpload"
      type="file"
      (change)="onFileSelected($event)"
      accept="image/*"
    />
  </div>

  <div *ngIf="widget.previewUrl" class="img-preview-container">
    <img [src]="widget.previewUrl" alt="preview" />
  </div>
</div>
