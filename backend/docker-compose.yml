services:
  webapi:
    container_name: dashboard_api
    image: dashboard
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      - db

  db:
    container_name: dashboard_db
    image: postgres:16
    environment:
      POSTGRES_DB: WidgetDB
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/postgresql/data