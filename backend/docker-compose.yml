networks:
    dashboard-network:
      driver: bridge
services:
  webapi:
    container_name: dashboard_api
    image: dashboard
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=WidgetDB;Username=user;Password=password123"
    ports:
      - "5062:5062"
    depends_on:
      - db
    networks:
      - dashboard-network
    
  db:
    container_name: dashboard_db
    image: postgres:16
    environment:
      POSTGRES_DB: WidgetDB
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/postgresql/data
    networks:
      - dashboard-network

  